services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    restart: always
    env_file: .env
    secrets: [ db_password ]
    volumes: [ mariadb_data:/var/lib/mysql ]
    networks: [ inception ]

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    restart: always
    env_file: .env
    secrets: [ db_password, wp_admin_password, wp_regular_password ]
    volumes: [ wordpress_data:/var/www/wordpress ]
    networks: [ inception ]
    depends_on: [ mariadb ]

  nginx:
    container_name: nginx
    build: ./requirements/nginx
    restart: always
    ports: [ "8443:443" ]
    volumes: [ wordpress_data:/var/www/wordpress ]
    networks: [ inception ]
    depends_on: [ wordpress ]

volumes:
  mariadb_data:
    driver_opts:
      type: none
      o: bind
      device: /home/mlabrirh/data/mariadb
  wordpress_data:
    driver_opts:
      type: none
      o: bind
      device: /home/mlabrirh/data/wordpress

networks:
  inception:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password
  wp_admin_password:
    file: ../secrets/wp_admin_password
  wp_regular_password:
    file: ../secrets/wp_regular_password
